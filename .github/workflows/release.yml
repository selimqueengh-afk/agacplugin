name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build with Maven
      run: mvn clean package
      
    - name: Get version from pom.xml
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: target/agac-*.jar
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: Release ${{ steps.get_version.outputs.tag }}
        body: |
          ## 🌳 Agac Plugin ${{ steps.get_version.outputs.tag }}
          
          ### 📦 Otomatik Derleme
          Bu release GitHub Actions tarafından otomatik olarak oluşturulmuştur.
          
          ### 🚀 Kurulum
          1. JAR dosyasını sunucunuzun `plugins` klasörüne kopyalayın
          2. Sunucuyu yeniden başlatın
          
          ### ✨ Özellikler
          - Otomatik ağaç kırma
          - Gerçekçi animasyonlar
          - Otomatik drop sistemi
          - Tüm ağaç türleri desteği
          
          ### 📋 Gereksinimler
          - Minecraft 1.21.7
          - Spigot/Paper
          - Java 17+
          
          ### 🔗 Detaylar
          Daha fazla bilgi için [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) dosyasını inceleyin.
          
          ### 📅 Build Tarihi
          ${{ github.event.head_commit.timestamp }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}