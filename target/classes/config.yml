# Agac Plugin Konfigürasyon Dosyası

# Ağaç kırma ayarları
tree-breaking:
  # Animasyon hızı (tick cinsinden, 20 tick = 1 saniye)
  animation-speed: 2
  
  # Ekstra drop şansları
  extra-drops:
    # Odun kırarken çubuk düşme şansı (%)
    stick-chance: 10.0
    
    # Yaprak kırarken elma düşme şansı (%)
    apple-chance: 5.0
    
    # Yaprak kırarken çubuk düşme şansı (%)
    leaf-stick-chance: 2.0

# Desteklenen ağaç türleri
supported-trees:
  logs:
    - OAK_LOG
    - BIRCH_LOG
    - SPRUCE_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - MANGROVE_LOG
    - CHERRY_LOG
    - BAMBOO_BLOCK
    - CRIMSON_STEM
    - WARPED_STEM
  
  leaves:
    - OAK_LEAVES
    - BIRCH_LEAVES
    - SPRUCE_LEAVES
    - JUNGLE_LEAVES
    - ACACIA_LEAVES
    - DARK_OAK_LEAVES
    - MANGROVE_LEAVES
    - CHERRY_LEAVES
    - AZALEA_LEAVES
    - FLOWERING_AZALEA_LEAVES
    - NETHER_WART_BLOCK
    - SHROOMLIGHT

# Desteklenen araçlar
supported-tools:
  - WOODEN_AXE
  - STONE_AXE
  - IRON_AXE
  - DIAMOND_AXE
  - NETHERITE_AXE

# Mesajlar
messages:
  prefix: "&6[Agac] &r"
  no-permission: "&cBu özelliği kullanma yetkiniz yok!"
  tree-broken: "&aAğaç başarıyla kırıldı!"
  invalid-tool: "&cAğaç kırmak için balta kullanmalısınız!"